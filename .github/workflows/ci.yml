name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test MAVLink bridge and real-SITL fixtures
        run: npm run test:bridge

      - name: Test GCS core
        run: npm run test:gcs-core

      - name: Test browser GCS
        run: npm run test:gcs

      - name: Test shared HUD UI
        run: npm run test:hud-ui

      - name: Test HUD application
        run: npm run test:hud

      - name: Lint HUD application
        run: npm run lint:hud

      - name: Build browser GCS
        run: npm run build:gcs

      - name: Build HUD application
        run: npm run build:hud

  esp32-native:
    name: ESP32 native logic
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run native C++ tests
        run: npm run test:esp32
