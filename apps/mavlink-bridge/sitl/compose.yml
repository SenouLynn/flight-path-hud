services:
  bridge:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @flight-path-hud/mavlink-bridge start"
    volumes:
      - ../../..:/workspace
      # `pnpm install` runs in Linux. Keep its native dependencies out of the host
      # bind mount so it cannot replace macOS Rolldown/Vite bindings used by the
      # browser GCS.
      - bridge_node_modules:/workspace/node_modules
      - ../recordings:/workspace/apps/mavlink-bridge/recordings
    ports:
      - "8080:8080"

  copter:
    build: .
    environment:
      VEHICLE: ArduCopter
      SYSID: "1"
      MISSION_FILE: /scenario/copter.waypoints
    volumes:
      - ./copter.waypoints:/scenario/copter.waypoints:ro
    depends_on:
      - bridge

  plane:
    build: .
    environment:
      VEHICLE: ArduPlane
      SYSID: "2"
      MISSION_FILE: /scenario/plane.waypoints
    volumes:
      - ./plane.waypoints:/scenario/plane.waypoints:ro
    depends_on:
      - bridge

volumes:
  bridge_node_modules:
