services:
  bridge:
    environment:
      MAVLINK_BRIDGE_ENABLE_MODE_CHANGE: "1"
  mode-change-controller:
    image: node:22-bookworm-slim
    working_dir: /workspace
    entrypoint: ["node", "apps/mavlink-bridge/sitl/mode_change_controller.js"]
    volumes:
      - ../../..:/workspace:ro
    depends_on: [bridge, copter, plane]
    stop_grace_period: 20s
