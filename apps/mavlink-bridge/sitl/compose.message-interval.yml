services:
  bridge:
    environment:
      MAVLINK_BRIDGE_ENABLE_MESSAGE_INTERVAL: "1"

  message-interval-controller:
    image: node:22-bookworm-slim
    working_dir: /workspace
    entrypoint: ["node", "apps/mavlink-bridge/sitl/message_interval_controller.js"]
    volumes:
      - ../../..:/workspace:ro
    depends_on:
      - bridge
      - copter
      - plane
    stop_grace_period: 20s
