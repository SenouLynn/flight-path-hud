services:
  bridge:
    environment:
      MAVLINK_BRIDGE_ENABLE_ARM_DISARM: "1"
      MAVLINK_BRIDGE_COMMAND_ENVIRONMENT: "sitl"
  arm-disarm-controller:
    image: node:22-bookworm-slim
    working_dir: /workspace
    entrypoint: ["node", "apps/mavlink-bridge/sitl/arm_disarm_controller.js"]
    volumes:
      - ../../..:/workspace:ro
    depends_on: [bridge, copter, plane]
    stop_grace_period: 30s
